name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest -q
      - run: uv build

  tui:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra tui
      - name: Headless TUI tests (skips fail)
        run: |
          uv run --locked --extra tui pytest tests/test_tui.py tests/test_operation_cancellation.py -q --junitxml=tui-results.xml
          uv run --locked --extra tui python -c "import xml.etree.ElementTree as E; assert not E.parse('tui-results.xml').findall('.//skipped'), 'TUI tests must not skip'"

  tui-native:
    name: Native keyboard migration (OpenCode 2.0.23)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra tui
      - name: Install bubblewrap
        run: |
          if ! command -v bwrap >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes bubblewrap
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install designated stock OpenCode
        run: ./scripts/install-native-test-clis.sh /tmp/session-migrate-tui-native opencode-v2
      - name: Real keyboard/core migration gates (skips fail)
        run: |
          set -a
          source /tmp/session-migrate-tui-native/session-migrate-native.env
          set +a
          uv run --locked --extra tui pytest tests/test_tui_native.py tests/test_continuity_native.py -q --junitxml=tui-native-results.xml
          uv run --locked --extra tui python scripts/assert_junit_no_skips.py tui-native-results.xml

  native-clients:
    name: Native client (${{ matrix.client }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        client:
          - antigravity
          - claude
          - codex
          - copilot
          - cursor
          - devin
          - grok
          - hermes
          - kilo
          - kimi
          - mastracode
          - muse
          - omp
          - opencode
          - opencode-v2
          - openhands
          - pi
          - qwen
          - vibe
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install bubblewrap
        run: |
          if ! command -v bwrap >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes bubblewrap
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: uv sync --locked
      - name: Install pinned ${{ matrix.client }} client
        run: ./scripts/install-native-test-clis.sh /tmp/session-migrate-native "${{ matrix.client }}"
      - name: Run credential-free exact-client gates
        run: >-
          ./scripts/run-native-test-client.sh
          "${{ matrix.client }}"
          /tmp/session-migrate-native/session-migrate-native.env

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
